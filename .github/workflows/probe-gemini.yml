name: Probe Gemini
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check key validity and free-tier limits
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "KEY EMPTY"; exit 1; fi
          echo "key length: ${#GEMINI_API_KEY}"

          echo "--- models list (HTTP status only) ---"
          code=$(curl -s -o /tmp/models.json -w "%{http_code}" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "--- error body (key redacted) ---"
            sed "s/$GEMINI_API_KEY/***/g" /tmp/models.json | head -20
            exit 1
          fi
          echo "--- flash models available ---"
          grep -o '"name": "models/[^"]*"' /tmp/models.json | grep -i flash | head -12

          echo "--- live translation test ---"
          for m in gemini-2.5-flash gemini-2.0-flash; do
            code=$(curl -s -o /tmp/gen.json -w "%{http_code}" \
              -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' \
              -X POST "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" \
              -d '{"contents":[{"parts":[{"text":"Translate to Dutch, output only the translation: Procurement data is messy."}]}]}')
            echo "$m -> HTTP $code"
            if [ "$code" = "200" ]; then
              grep -o '"text": "[^"]*"' /tmp/gen.json | head -2
            else
              sed "s/$GEMINI_API_KEY/***/g" /tmp/gen.json | head -8
            fi
          done
