name: Probe Gemini
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact batch-translation payload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > /tmp/body.json <<'JSON'
          {
            "contents": [{"parts": [{"text": "Translate each numbered line to Dutch. Output only the numbered translations, same numbering, one per line.\n1. Procurement data is messy.\n2. Asset registers drift over time.\n3. Clean data is a prerequisite for AI."}]}],
            "generationConfig": {
              "temperature": 0.1,
              "maxOutputTokens": 4096,
              "thinkingConfig": {"thinkingBudget": 0}
            }
          }
          JSON
          code=$(curl -s -o /tmp/r.json -w "%{http_code}" \
            -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent" \
            --data @/tmp/body.json)
          echo "PAYLOAD_HTTP $code"
          sed "s/$GEMINI_API_KEY/***/g" /tmp/r.json | head -40
