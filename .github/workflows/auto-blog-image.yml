name: Auto blog image

on:
  push:
    branches: [main]
    paths:
      - "content/blog/en/**"
      - "lib/blog-posts.ts"
  workflow_dispatch: {}

concurrency:
  # Own group per workflow: this one only ever commits public/images/blog,
  # lib/blog-posts.ts and content/blog/image-prompts.json, which auto-translate
  # never touches, so the two workflows don't need to share a lane — sharing
  # one previously let a translate run's queued slot get bumped by an image
  # run (or vice versa), so the bumped workflow never ran at all for that
  # push. Runs of *this* workflow still queue behind each other rather than
  # overlap, since two of them touching the same generated files concurrently
  # is the actual conflict risk.
  group: blog-image-push
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync to the latest main
        # If this run was queued behind an earlier one (or another push
        # landed between trigger and start), pull that in first so the
        # generation step below sees the true current state — otherwise it
        # can regenerate something another run already produced, or miss
        # something a concurrent commit just added.
        run: git pull origin main

      - name: Generate blog hero images
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-blog-images.js

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/blog lib/blog-posts.ts content/blog/image-prompts.json
          if git diff --staged --quiet; then
            echo "No new images to commit."
          else
            git commit -m "chore: auto-generate blog hero images"
            # Another workflow (e.g. auto-translate) may push to main at the
            # same time this one does — rebase onto the latest main before
            # pushing so neither run clobbers the other's commit.
            pushed=false
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                pushed=true
                break
              fi
              # A conflicted rebase leaves the tree mid-rebase, and every later
              # `git pull` then fails with "unmerged files" — so reset before retrying.
              git rebase --abort 2>/dev/null || true
              echo "Push failed, retrying ($i)..."
              sleep $((i * 10))
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push after 5 attempts — generated work was discarded."
              exit 1
            fi
          fi
