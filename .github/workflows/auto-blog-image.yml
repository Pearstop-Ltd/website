name: Auto blog image

on:
  push:
    branches: [main]
    paths:
      - "content/blog/en/**"
      - "lib/blog-posts.ts"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate blog hero images
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_API_TOKEN: ${{ secrets.POLLINATIONS_API_TOKEN }}
        run: node scripts/generate-blog-images.js

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/blog lib/blog-posts.ts content/blog/image-prompts.json
          if git diff --staged --quiet; then
            echo "No new images to commit."
          else
            git commit -m "chore: auto-generate blog hero images"
            # Another workflow (e.g. auto-translate) may push to main at the
            # same time this one does — rebase onto the latest main before
            # pushing so neither run clobbers the other's commit.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push failed, retrying ($i)..."
              sleep 5
            done
          fi
