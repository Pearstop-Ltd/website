name: Auto-translate

on:
  push:
    branches: [main]
    paths:
      - "messages/en.json"
      - "content/blog/en/**"
  workflow_dispatch: {}

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run translation script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/translate.js

      - name: Commit translated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add messages/nl.json content/blog/nl
          if git diff --staged --quiet; then
            echo "No translation changes to commit."
          else
            git commit -m "chore: auto-translate updated EN content to NL"
            # Another workflow (e.g. auto-blog-image) may push to main at the
            # same time this one does — rebase onto the latest main before
            # pushing so neither run clobbers the other's commit.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push failed, retrying ($i)..."
              sleep 5
            done
          fi
