name: Auto-translate

on:
  push:
    branches: [main]
    paths:
      - "messages/en.json"
      - "content/blog/en/**"
  workflow_dispatch: {}

concurrency:
  # Own group per workflow: this one only ever commits messages/{nl,fr,de}.json
  # and content/blog/{nl,fr,de}, which auto-blog-image never touches, so the
  # two workflows don't need to share a lane — sharing one previously let a
  # translate run's queued slot get bumped by an image run (or vice versa),
  # so the bumped workflow never ran at all for that push. Runs of *this*
  # workflow still queue behind each other rather than overlap.
  group: translate-push
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync to the latest main
        # If this run was queued behind an earlier one (or another push
        # landed between trigger and start), pull that in first — otherwise
        # the translate script below can work from a stale snapshot (already
        # missing content that landed since), re-translate something that was
        # already handled, and hit a real merge conflict on push instead of a
        # clean fast-forward.
        run: git pull origin main

      - name: Run translation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/translate.js

      - name: Commit translated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add messages/nl.json messages/fr.json messages/de.json content/blog/nl content/blog/fr content/blog/de
          if git diff --staged --quiet; then
            echo "No translation changes to commit."
          else
            git commit -m "chore: auto-translate updated EN content to NL, FR, DE"
            # Another workflow (e.g. auto-blog-image) may push to main at the
            # same time this one does — rebase onto the latest main before
            # pushing so neither run clobbers the other's commit.
            pushed=false
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                pushed=true
                break
              fi
              # A conflicted rebase leaves the tree mid-rebase, and every later
              # `git pull` then fails with "unmerged files" — so reset before retrying.
              git rebase --abort 2>/dev/null || true
              echo "Push failed, retrying ($i)..."
              sleep $((i * 10))
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push after 5 attempts — generated work was discarded."
              exit 1
            fi
          fi
