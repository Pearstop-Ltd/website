name: Auto-translate

on:
  push:
    branches: [main]
    paths:
      - "messages/en.json"
      - "content/blog/en/**"
  workflow_dispatch: {}

concurrency:
  # Shared across both content workflows: they push to main and both touch
  # lib/blog-posts.ts, so concurrent runs rebase-conflict and lose work.
  group: main-content-push
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run translation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/translate.js

      - name: Commit translated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add messages/nl.json content/blog/nl
          if git diff --staged --quiet; then
            echo "No translation changes to commit."
          else
            git commit -m "chore: auto-translate updated EN content to NL"
            # Another workflow (e.g. auto-blog-image) may push to main at the
            # same time this one does — rebase onto the latest main before
            # pushing so neither run clobbers the other's commit.
            pushed=false
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                pushed=true
                break
              fi
              # A conflicted rebase leaves the tree mid-rebase, and every later
              # `git pull` then fails with "unmerged files" — so reset before retrying.
              git rebase --abort 2>/dev/null || true
              echo "Push failed, retrying ($i)..."
              sleep $((i * 10))
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push after 5 attempts — generated work was discarded."
              exit 1
            fi
          fi
